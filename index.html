<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Square Feet Calculator — Feet Inch Sut</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <meta name="theme-color" content="#0f1e30">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SqFt Calc">
  <meta name="description" content="Feet Inch Sut se square feet nikalo — construction ke liye">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f1f5f9; color: #172338; font-family: system-ui, sans-serif; }
    main { max-width: 1100px; margin: auto; padding: 14px 8px 36px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .subtitle { color: #52647a; margin: 0 0 10px; font-size: 13px; }
    .settings { display: flex; gap: 6px; align-items: center; margin-bottom: 14px; font-size: 13px; }
    select { font: inherit; background: white; border: 1px solid #cbd5e1; border-radius: 8px; padding: 6px 8px; }

    .row { background: white; border: 1px solid #dce4ed; border-radius: 10px; padding: 6px 8px; margin-bottom: 5px; }
    .line-inner { display: flex; align-items: center; gap: 3px; flex-wrap: nowrap; }
    .row-label { font-size: 11px; font-weight: 700; color: #94a3b8; min-width: 14px; flex-shrink: 0; }
    .triple { display: flex; gap: 2px; flex-shrink: 0; }
    .iw { display: flex; flex-direction: column; align-items: center; gap: 1px; }
    .iw span { font-size: 8px; color: #94a3b8; font-weight: 600; line-height: 1; }
    .iw input {
      width: 32px; padding: 5px 0;
      border: 1px solid #cbd5e1; border-radius: 6px;
      background: #f8fafc; color: #172338;
      text-align: center; font-size: 12px; font-family: inherit;
    }
    .iw input:focus { outline: 2px solid #2563eb33; border-color: #2563eb; background: #fff; }
    .iw input:invalid { border-color: #dc2626; }
    .sym { font-size: 14px; color: #94a3b8; flex-shrink: 0; padding: 0 1px; padding-top: 10px; }
    .result {
      background: #eff6ff; border: 1px solid #bfdbfe;
      border-radius: 8px; padding: 4px 7px;
      flex: 1; min-width: 0; overflow: hidden;
    }
    .area { display: block; color: #175bba; font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .actions { display: flex; gap: 8px; margin: 12px 0; }
    button { border: 0; border-radius: 10px; padding: 9px 14px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
    .reset-btn { background: #e2e8f0; color: #334155; }
    .pdf-btn { background: #16a34a; color: white; }
    .print-btn { background: #7c3aed; color: white; }
    button:hover { filter: brightness(.96); }

    .total { background: #122b49; color: white; padding: 18px; border-radius: 16px; }
    .total-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .total-head h2 { font-size: 16px; margin: 0; }
    .count { background: #ffffff16; border-radius: 20px; padding: 3px 9px; font-size: 11px; }
    #totalFeet { display: block; font-size: clamp(22px, 6vw, 36px); font-weight: 800; margin: 10px 0 3px; }
    .unit { color: #bbd4ed; font-size: 13px; }
    .note { color: #64748b; font-size: 11px; margin-top: 8px; }

    /* ── Print / PDF styles ── */
    @media print {
      * { box-sizing: border-box; }
      body { background: white; margin: 0; padding: 0; }
      .no-print { display: none !important; }
      main { padding: 10mm 12mm; max-width: 100% !important; width: 100% !important; }
      .print-table { display: table !important; width: 100% !important; }
      .row, .total, .settings, .actions { display: none !important; }
      #rows { display: none !important; }
      .note { display: none !important; }
      #conversion { display: block !important; font-size: 10px; color: #666; margin-top: 10px; }
    }
    .print-table {
      display: none;
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
      margin-top: 14px;
      page-break-inside: auto;
    }
    .print-table th {
      background: #122b49;
      color: white;
      padding: 12px 14px;
      text-align: center;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.3px;
    }
    .print-table td {
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      text-align: center;
      font-size: 14px;
      color: #1e293b;
    }
    .print-table tr:nth-child(even) td { background: #f1f5f9; }
    .print-table tr:nth-child(odd) td { background: #ffffff; }
    .print-table .total-row td {
      background: #122b49 !important;
      color: white !important;
      font-weight: 800;
      font-size: 16px;
      border: none;
      padding: 13px 14px;
    }
    .print-header { display: none; }
    @media print {
      .print-header {
        display: flex !important;
        align-items: center;
        justify-content: space-between;
        border-bottom: 3px solid #122b49;
        padding-bottom: 10px;
        margin-bottom: 14px;
      }
      .print-header h2 {
        font-size: 22px;
        margin: 0;
        color: #122b49;
        font-weight: 800;
      }
      .print-header p {
        margin: 0;
        color: #52647a;
        font-size: 12px;
        text-align: right;
      }
    }
  </style>
</head>
<body>
<main>
  <h1 class="no-print">📐 Feet Inch Sut Calculator</h1>
  <p class="subtitle no-print">Naap bharo — area aur total apne aap niklega.</p>
  <div class="settings no-print">
    <label for="sutScale">1 inch = kitne sut?</label>
    <select id="sutScale">
      <option value="8">8 sut</option>
      <option value="10">10 sut</option>
    </select>
  </div>

  <section id="rows"></section>

  <div class="actions no-print">
    <button class="reset-btn" id="reset">Sab clear</button>
    <button class="pdf-btn" id="pdfBtn">📄 PDF / Share</button>
    <button class="print-btn" id="printBtn">🖨️ Print</button>
  </div>

  <section class="total no-print" aria-live="polite">
    <div class="total-head">
      <h2>Total Area</h2>
      <span class="count" id="lineCount">3 lines</span>
    </div>
    <output id="totalFeet">0</output>
    <div class="unit">Square feet (ft²)</div>
  </section>

  <!-- Print-only table -->
  <div class="print-header">
    <h2>📐 Feet Inch Sut Calculator</h2>
    <p id="printDate"></p>
  </div>
  <table class="print-table" id="printTable">
    <thead>
      <tr>
        <th>#</th>
        <th>Lambai (ft / in / su)</th>
        <th>Chaudai (ft / in / su)</th>
        <th>Area (sq ft)</th>
      </tr>
    </thead>
    <tbody id="printBody"></tbody>
  </table>

  <p class="note" id="conversion"></p>
  <p class="note no-print">Khali box = 0. Decimal bhi bhar sakte hain.</p>
</main>
<script>
  const rows      = document.getElementById("rows");
  const scale     = document.getElementById("sutScale");
  const totalFeet = document.getElementById("totalFeet");
  const fmt = new Intl.NumberFormat("en-IN", { maximumFractionDigits: 10 });
  const f = v => fmt.format(v);
  // Round to 4 decimal places for display
  const fmtArea = v => {
    const rounded = Math.round(v * 10000) / 10000;
    return fmt.format(rounded);
  };

  function makeTriple(n, side) {
    return `<div class="triple">
      ${[["ft","Feet"],["in","Inch"],["su","Sut"]].map(([a,full]) =>
        `<div class="iw"><span>${a}</span>
         <input type="number" min="0" step="any" inputmode="decimal" placeholder="0"
                aria-label="Line ${n} ${side} ${full}"></div>`
      ).join("")}
    </div>`;
  }

  function addRow(focus=false) {
    const n = rows.children.length + 1;
    const el = document.createElement("article");
    el.className = "row";
    el.innerHTML = `<div class="line-inner">
      <span class="row-label">${n}</span>
      ${makeTriple(n,"length")}
      <div class="sym">×</div>
      ${makeTriple(n,"width")}
      <div class="sym">=</div>
      <div class="result"><strong class="area">0 sq ft</strong></div>
    </div>`;
    rows.appendChild(el);
    calc();
    if (focus) el.querySelector("input").focus();
  }

  let lastTotal = 0;

  function calc() {
    const s = +scale.value, psf = (12*s)**2;
    let total=0, err=false;
    rows.querySelectorAll(".row").forEach(row => {
      const inp = [...row.querySelectorAll("input")];
      const aEl = row.querySelector(".area");
      const ok = inp.every(i => i.validity.valid && (i.value==="" || (isFinite(+i.value) && +i.value>=0)));
      if (!ok) { aEl.textContent="Galat naap"; err=true; return; }
      const v = inp.map(i => i.value===""?0:+i.value);
      const len = v[0]*12*s + v[1]*s + v[2];
      const wid = v[3]*12*s + v[4]*s + v[5];
      const area = len*wid;
      if (!isFinite(area)||area>Number.MAX_SAFE_INTEGER) { aEl.textContent="Bahut badi"; err=true; return; }
      total += area;
      // Show area with 4 decimal places + inch breakdown
      const lenInch = v[0]*12 + v[1] + v[2]/s;
      const widInch = v[3]*12 + v[4] + v[5]/s;
      const areaInSqIn = lenInch * widInch;
      aEl.textContent = `${fmtArea(area/psf)} sq ft  (${f(lenInch)}" × ${f(widInch)}" = ${fmtArea(areaInSqIn)} sq in)`;
    });
    lastTotal = total;
    totalFeet.textContent = err?"—":fmtArea(total/psf);
    document.getElementById("lineCount").textContent = `${rows.children.length} lines`;
    document.getElementById("conversion").textContent =
      `1 ft = 12 in · 1 in = ${s} su · 1 sq ft = 144 sq in · 1 sq in = ${s*s} sq su`;
  }

  function buildPrintTable() {
    const s = +scale.value, psf = (12*s)**2;
    const tbody = document.getElementById("printBody");
    tbody.innerHTML = "";
    let total = 0;
    rows.querySelectorAll(".row").forEach((row, idx) => {
      const inp = [...row.querySelectorAll("input")];
      const v = inp.map(i => i.value===""?0:(+i.value||0));
      const len = v[0]*12*s + v[1]*s + v[2];
      const wid = v[3]*12*s + v[4]*s + v[5];
      const area = len*wid;
      if (!isFinite(area)) return;
      total += area;
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${idx+1}</td>
        <td>${v[0]} ft ${v[1]} in ${v[2]} su</td>
        <td>${v[3]} ft ${v[4]} in ${v[5]} su</td>
        <td><strong>${f(area/psf)} sq ft</strong></td>`;
      tbody.appendChild(tr);
    });
    const totalRow = document.createElement("tr");
    totalRow.className = "total-row";
    totalRow.innerHTML = `<td colspan="3">Kul Total Area</td><td>${f(total/psf)} sq ft</td>`;
    tbody.appendChild(totalRow);
    document.getElementById("printDate").textContent =
      `Date: ${new Date().toLocaleDateString("en-IN")} · 1 inch = ${s} sut`;
  }

  rows.addEventListener("input", e => {
    calc();
    const allRows = rows.querySelectorAll(".row");
    const lastRow = allRows[allRows.length - 1];
    if (lastRow && lastRow.contains(e.target)) {
      const hasValue = [...lastRow.querySelectorAll("input")].some(i => i.value !== "");
      if (hasValue) addRow(false);
    }
  });

  scale.addEventListener("change", calc);

  document.getElementById("reset").addEventListener("click", () => {
    if (!confirm("Sabhi lines clear karni hain?")) return;
    rows.querySelectorAll("input").forEach(i => i.value="");
    calc();
    rows.querySelector("input").focus();
  });

  document.getElementById("pdfBtn").addEventListener("click", () => {
    buildPrintTable();
    window.print();
  });

  document.getElementById("printBtn").addEventListener("click", () => {
    buildPrintTable();
    window.print();
  });

  for (let i=0;i<3;i++) addRow();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then(() => console.log('SW registered'))
        .catch(err => console.log('SW error:', err));
    });
  }
</script>
</body>
</html>
